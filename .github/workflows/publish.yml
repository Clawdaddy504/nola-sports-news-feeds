name: Publish sports news feeds

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sports-news-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test feed parsing and publication
        run: python -m unittest discover -s tests -v
      - name: Build current feeds
        run: python build_feeds.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Save a weekly source-health record
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          index = json.loads(Path('docs/index.json').read_text())
          path = Path('status/weekly.json')
          week = datetime.now(timezone.utc).strftime('%G-W%V')
          if path.exists() and json.loads(path.read_text()).get('week') == week:
              raise SystemExit(0)
          path.parent.mkdir(exist_ok=True)
          record = {
              'week': week,
              'last_checked': index['generated_at'],
              'successful_sources': index['successful_sources'],
              'source_count': index['source_count'],
              'new_orleans_headlines': next(feed['count'] for feed in index['feeds'] if feed['slug'] == 'new-orleans'),
          }
          path.write_text(json.dumps(record, indent=2) + '\n')
          PY
          git add status/weekly.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Record weekly feed health"
            git push
          fi
